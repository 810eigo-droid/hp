<style>
  /* =========================================
     [BLOCK-01] FV1枚目 専用CSS
     ========================================= */

  /* --- FVセクション本体 --- */
  .tfd-fv1 {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;
    background-image: url('http://elementor.810eigo.com/wp-content/uploads/2026/03/taffv2.webp?v=2');
    background-size: cover;
    background-position: right center;
    background-repeat: no-repeat;
    background-color: var(--tfd-bg);
    overflow: hidden;
  }

  /* コンテンツエリア */
  .tfd-fv1__inner {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: var(--tfd-wide-max);
    margin: 0 auto;
    padding: 80px var(--tfd-section-px);
    min-height: calc(100vh - 160px);
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .tfd-fv1__content {
    width: 100%;
    max-width: 650px;
    animation: tfdFadeInUp 1.2s ease-out forwards;
    opacity: 0;
    transform: translateY(20px);
  }

  /* --- サブタイトル --- */
  .tfd-fv1__sub {
    font-size: clamp(1.1rem, 1.5vw, 1.3rem);
    font-weight: 600;
    color: var(--tfd-text);
    margin: 0 0 0.5rem 0;
    letter-spacing: 0.05em;
  }

  /* --- メインタイトル --- */
  .tfd-fv1__title {
    font-size: clamp(1.8rem, 3.5vw, 3.2rem);
    font-weight: 700;
    color: var(--tfd-main);
    line-height: 1.4;
    margin: 0 0 1.5rem 0;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .tfd-fv1__title-em {
    color: var(--tfd-accent);
  }

  /* --- リード文 --- */
  .tfd-fv1__lead {
    font-size: clamp(1rem, 1.5vw, 1.25rem);
    font-weight: 600;
    color: var(--tfd-main);
    margin: 0 0 1.5rem 0;
    line-height: 1.7;
  }

  /* --- サービスリスト --- */
  .tfd-fv1__list {
    list-style: none;
    padding: 1.5rem;
    margin: 0 0 2.5rem 0;
    background: rgba(255, 255, 255, 0.7);
    border-radius: var(--tfd-radius-sm);
    border-left: 4px solid var(--tfd-accent);
    display: inline-block;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .tfd-fv1__list li {
    position: relative;
    padding-left: 2rem;
    margin-bottom: 0.8rem;
    font-size: clamp(1.1rem, 1.5vw, 1.25rem);
    font-weight: 700;
    color: var(--tfd-main);
    letter-spacing: 0.05em;
  }

  .tfd-fv1__list li:last-child {
    margin-bottom: 0;
  }

  .tfd-fv1__list li::before {
    content: '\2713';
    position: absolute;
    left: 0;
    top: 0;
    color: var(--tfd-accent);
    font-size: 1.2rem;
    font-family: var(--tfd-font-sans);
    speak: never;
  }

  /* --- CTA --- */
  .tfd-fv1__cta {
    margin-top: 1rem;
  }

  /* =========================================
     スマホ専用：画像FV
     ========================================= */
  .tfd-fv1__sp-visual {
    display: none;
  }

  /* =========================================
     レスポンシブ: モバイル
     ========================================= */
  @media (max-width: 767px) {
    .tfd-fv1 {
      display: none !important;
    }

    .tfd-fv1__sp-visual {
      display: block;
      width: 100%;
    }

    .tfd-fv1__sp-visual img {
      width: 100%;
      height: auto;
      display: block;
    }
  }

  /* タブレット */
  @media (min-width: 768px) and (max-width: 1023px) {
    .tfd-fv1__content {
      max-width: 520px;
    }
  }
</style>
